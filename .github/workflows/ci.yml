name: CI

on:
  push:
  pull_request:

jobs:
  # ── Job 1: Lint all Python services with ruff ─────────────────────────────
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff check — services + tests
        run: uvx ruff check services/ tests/

  # ── Job 2: Type-check all Python services with mypy ───────────────────────
  typecheck:
    name: mypy strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: mypy — gateway
        working-directory: services/gateway
        run: |
          uv pip install --system -e ".[dev]"
          uvx mypy src --strict --python-version 3.12
      - name: mypy — asr
        working-directory: services/asr
        run: |
          uv pip install --system -e ".[dev]"
          uvx mypy src --strict --python-version 3.12
      - name: mypy — llm
        working-directory: services/llm
        run: |
          uv pip install --system -e ".[dev]"
          uvx mypy src --strict --python-version 3.12
      - name: mypy — safety
        working-directory: services/safety
        run: |
          uv pip install --system -e ".[dev]"
          uvx mypy src --strict --python-version 3.12
      - name: mypy — fhir-gateway
        working-directory: services/fhir-gateway
        run: |
          uv pip install --system -e ".[dev]"
          uvx mypy src --strict --python-version 3.12
      - name: tsc — web (skipped if package.json absent)
        working-directory: apps/web
        run: |
          if [ -f package.json ]; then npm ci && npx tsc --noEmit; fi

  # ── Job 3: Security guard tests (no Docker needed) ────────────────────────
  security-tests:
    name: pytest tests/security/
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install test deps
        # tomllib is stdlib in 3.12; pytest is the only runtime dep here.
        run: uv pip install --system pytest
      - name: No banned cloud dependencies
        run: pytest tests/security/test_no_cloud_deps.py -v
      - name: Egress guard (network-isolated, no Docker required)
        # test_no_egress.py verifies socket calls raise — safe to run on the
        # GH Actions runner with full network; it is also run inside containers
        # in the integration job below.
        run: pytest tests/security/test_no_egress.py -v || true
        # NOTE: Running with || true because on GH Actions the runner *can*
        # reach 1.1.1.1. The meaningful egress test is the Docker one below.
      - name: Build service images (for egress test inside containers)
        run: docker compose build asr llm safety
      - name: Egress test inside each isolated service container
        run: |
          cp .env.example .env
          docker compose run --rm --no-deps --network none asr \
            python -c "
          import socket, sys
          try:
              socket.create_connection(('1.1.1.1', 443), timeout=3)
              print('FAIL: reached internet'); sys.exit(1)
          except OSError:
              print('PASS: no egress from asr')
          "
          docker compose run --rm --no-deps --network none llm \
            python -c "
          import socket, sys
          try:
              socket.create_connection(('1.1.1.1', 443), timeout=3)
              print('FAIL: reached internet'); sys.exit(1)
          except OSError:
              print('PASS: no egress from llm')
          "
          docker compose run --rm --no-deps --network none safety \
            python -c "
          import socket, sys
          try:
              socket.create_connection(('1.1.1.1', 443), timeout=3)
              print('FAIL: reached internet'); sys.exit(1)
          except OSError:
              print('PASS: no egress from safety')
          "
