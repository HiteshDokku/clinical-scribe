[project]
name = "asr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "faster-whisper>=1.0",
    "silero-vad>=5.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev   = ["pytest>=8.3", "mypy>=1.13", "ruff>=0.7", "websockets>=13.0"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
