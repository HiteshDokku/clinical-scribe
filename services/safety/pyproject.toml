[project]
name = "safety"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "rapidfuzz>=3.10",
    "pandas>=2.2",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "transformers>=4.40",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "mypy>=1.13", "ruff>=0.7", "pytest-asyncio>=0.24", "aiosqlite>=0.20"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
